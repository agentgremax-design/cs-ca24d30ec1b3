<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#003DA5"><title>Call today</title>
<style>
:root{--red:#DC1C2E;--blue:#003DA5;--bg:#f2f4f8}*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1b1b1b;font-size:15px}
header{background:var(--blue);color:#fff;padding:10px 14px 8px;border-bottom:5px solid var(--red);position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}#sync{font-size:11px;opacity:.85}
.stats{display:flex;gap:10px;align-items:flex-end;margin-top:6px;font-size:12px}.bars{display:flex;gap:3px;align-items:flex-end;height:26px}
.bars div{width:14px;background:#ffffff70;border-radius:2px 2px 0 0;position:relative}.bars div.t{background:#fff}.bars span{position:absolute;bottom:-13px;left:0;right:0;text-align:center;font-size:9px}
.warn{background:#fff3cd;color:#7a5a00;border-radius:8px;padding:8px 10px;margin:10px 0;font-size:13px;font-weight:600}
main{padding:10px;max-width:640px;margin:auto}h3{margin:16px 2px 8px;font-size:14px;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:6px solid var(--blue);box-shadow:0 1px 4px #0002}
.card.od{border-left-color:var(--red);background:#fff5f5}h2{margin:0;font-size:17px;color:var(--blue)}
.meta{font-size:12px;color:#666;margin-top:2px}.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#e8edf7;color:var(--blue);margin:4px 4px 0 0}
.od .due{background:var(--red);color:#fff}.newb{background:var(--red);color:#fff}
.row{margin:5px 0;font-size:14px}.lbl{font-weight:600;color:#444}
.acts{display:flex;gap:8px;margin:10px 0 6px}.acts a{flex:1;text-align:center;text-decoration:none;padding:12px 6px;border-radius:8px;font-weight:700;color:#fff;font-size:14px}
.call{background:var(--blue)}.wa{background:#1fa855}.lnk{background:#555}
.op{background:#f4f6fb;border-radius:8px;padding:8px;font-size:13px;margin-top:6px}.ln{background:#eef2fb;border-left:3px solid var(--blue);border-radius:6px;padding:6px 8px;font-size:13px;margin-top:6px;white-space:pre-wrap;max-height:90px;overflow:auto}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.grid button{flex:1 1 30%;padding:11px 4px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;font-weight:600;font-size:13px}
.grid button.r{border-color:var(--red);color:var(--red)}.grid button.g{border-color:#1fa855;color:#1fa855}
details summary{font-weight:700;color:var(--blue);padding:10px 2px;font-size:14px;cursor:pointer}
dialog{border:0;border-radius:12px;width:min(94vw,420px)}dialog::backdrop{background:#0006}
input,textarea{width:100%;border:1px solid #c8c8c8;border-radius:8px;padding:10px;font:inherit;margin-top:6px}textarea{min-height:70px}
.db{display:flex;gap:8px;margin-top:10px}.db button{flex:1;padding:11px;border-radius:8px;border:0;font-weight:700}.ok{background:var(--blue);color:#fff}.cx{background:#ddd}
.qp{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.qp button{flex:1;padding:8px 4px;border:1px solid #bbb;background:#fff;border-radius:6px;font-size:12px}
#toast{position:fixed;left:10px;right:10px;bottom:16px;background:#222;color:#fff;padding:12px 14px;border-radius:10px;display:none;justify-content:space-between;align-items:center;z-index:9}
#toast button{background:none;border:0;color:#7fb2ff;font-weight:700;font-size:14px}.empty{text-align:center;color:#777;padding:20px}
</style></head><body>
<header><div class="top"><h1>Call today</h1><span id="sync">Loading…</span></div>
<div class="stats"><div><b id="newToday">–</b> new today<br><span id="dueCount"></span></div><div class="bars" id="bars"></div></div></header>
<main><div id="quiet"></div><div id="list"></div></main>
<dialog id="dlg"><form method="dialog"><b id="dTitle"></b><div id="dWhen" style="display:none"><div class="meta" style="margin-top:8px">Date &amp; time (SAST)</div>
<input type="datetime-local" id="dt" step="900"><div class="qp"><button type="button" data-q="0">Today 16:00</button><button type="button" data-q="1">Tomorrow 09:00</button><button type="button" data-q="7">Next week</button></div></div>
<textarea id="note" placeholder="Note (optional)"></textarea><div class="db"><button value="cancel" class="cx">Cancel</button><button value="ok" class="ok">Save</button></div></form></dialog>
<div id="toast"><span id="tmsg"></span><button id="undo">UNDO</button></div>
<script>
const API="https://eapkewkfebykborjlyby.supabase.co/functions/v1/calls";
const h=new URLSearchParams(location.hash.slice(1));if(h.get("t")){localStorage.setItem("cs.t",h.get("t"));history.replaceState(null,"",location.pathname)}
const TOK=localStorage.getItem("cs.t")||"";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let leads=JSON.parse(localStorage.getItem("cs.leads")||"[]"),events=[];
const TZ="Africa/Johannesburg",dk=d=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(new Date(d));
const fmt=d=>new Date(d).toLocaleString("en-ZA",{timeZone:TZ,weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const intl=p=>{let d=String(p||"").replace(/\D/g,"");if(d.startsWith("0"))d="27"+d.slice(1);return d};
const realUrl=u=>/^https?:\/\/\S+$/i.test(String(u||"").trim())?String(u).trim():null;
async function api(m,b){const r=await fetch(API,{method:m,headers:{"x-token":TOK,"content-type":"application/json"},body:b?JSON.stringify(b):undefined});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d}
async function load(){if(!TOK){$("#sync").textContent="No access key";$("#list").innerHTML='<div class="empty">Open this page with your private link.</div>';return}
 try{const d=await api("GET");leads=d.leads;events=d.events;localStorage.setItem("cs.leads",JSON.stringify(leads));$("#sync").textContent="Synced "+new Date().toLocaleTimeString("en-ZA",{timeZone:TZ,hour:"2-digit",minute:"2-digit"})}
 catch(e){$("#sync").textContent=e.message==="unauthorized"?"Access key wrong":"Offline copy"}render()}
function stats(){const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);days.push({k:dk(d),lab:new Intl.DateTimeFormat("en-ZA",{timeZone:TZ,weekday:"narrow"}).format(d),n:0})}
 leads.forEach(l=>{const x=l.created_at&&days.find(d=>d.k===dk(l.created_at));if(x)x.n++});const mx=Math.max(1,...days.map(d=>d.n));
 $("#bars").innerHTML=days.map((d,i)=>`<div class="${i==6?"t":""}" style="height:${4+22*d.n/mx}px" title="${d.n}"><span>${d.lab}</span></div>`).join("");
 $("#newToday").textContent=days[6].n;const last3=days.slice(4).reduce((a,d)=>a+d.n,0);
 $("#quiet").innerHTML=last3===0?'<div class="warn">⚠ Farm going quiet: no new leads in 3 days. Time to widen the search (Lynnwood) or work the follow-ups.</div>':""}
function card(l,kind){const now=Date.now(),od=l.follow_up_at&&new Date(l.follow_up_at)<now,isNew=l.created_at&&now-new Date(l.created_at)<864e5,url=realUrl(l.listing_link);
 const fn=String(l.name||"").split(" ")[0],last=(l.notes||"").trim().split("\n").pop();
 return `<div class="card${od?" od":""}" data-id="${l.id}"><h2>${esc(l.name)}${isNew?' <span class="pill newb">New today</span>':""}</h2>
 <div class="meta">${esc(l.suburb||"")}${l.price_band?" · "+esc(l.price_band):""}${l.sale_or_rental?" · "+esc(l.sale_or_rental):""}${l.attempts?" · Attempts: "+l.attempts:""}</div>
 ${l.follow_up_at?`<span class="pill due">${od?"Overdue · ":""}${esc(l.next_action||"Follow up")} ${fmt(l.follow_up_at)}</span>`:`<span class="pill">To call</span>`}${l.last_contacted?`<span class="pill" style="background:#eee;color:#555">Last ${fmt(l.last_contacted)}</span>`:""}
 <div class="row">${esc(l.property||"")}${l.address?`<div class="meta">${esc(l.address)}</div>`:""}</div>
 <div class="acts">${l.phone?`<a class="call" href="tel:${esc(String(l.phone).replace(/[^\d+]/g,""))}">📞 ${esc(l.phone)}</a><a class="wa" href="https://wa.me/${intl(l.phone)}" target="_blank" rel="noopener">WhatsApp</a>`:'<span class="meta">No number</span>'}${url?`<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Listing ↗</a>`:""}</div>
 ${l.opener?`<div class="op"><span class="lbl">Opener:</span> ${esc(l.opener)}${l.opener_followup?`<br><span class="lbl">Then:</span> ${esc(l.opener_followup)}`:""}</div>`:""}
 ${last?`<div class="ln"><span class="lbl">Last note:</span> ${esc(last)}</div>`:l.comments?`<div class="ln"><span class="lbl">Notes:</span> ${esc(l.comments)}</div>`:""}
 <div class="grid"><button data-o="No answer">No answer</button><button class="g" data-o="WhatsApp sent">WhatsApp sent</button><button data-o="Call back">Call back on…</button><button class="g" data-o="Interested">Interested / appt</button><button class="r" data-o="Not interested">Not interested</button></div></div>`}
function render(){stats();const now=new Date(),eod=new Date(dk(now)+"T23:59:59+02:00"),act=leads.filter(l=>!l.closed&&!l.do_not_call);
 const due=act.filter(l=>l.follow_up_at&&new Date(l.follow_up_at)<=eod).sort((a,b)=>new Date(a.follow_up_at)-new Date(b.follow_up_at));
 const fresh=act.filter(l=>!l.follow_up_at).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
 const later=act.filter(l=>l.follow_up_at&&new Date(l.follow_up_at)>eod).sort((a,b)=>new Date(a.follow_up_at)-new Date(b.follow_up_at));
 $("#dueCount").textContent=(due.length+fresh.length)+" to call · "+due.length+" follow-ups";
 $("#list").innerHTML=`<h3>Due now (${due.length})</h3>${due.map(card).join("")||'<div class="empty">Nothing overdue 🎉</div>'}
 <h3>To call (${fresh.length})</h3>${fresh.map(card).join("")||'<div class="empty">No fresh leads.</div>'}
 <details><summary>Later (${later.length})</summary>${later.map(card).join("")}</details>`}
let cur=null,undoId=null;
function ask(l,o){return new Promise(res=>{const d=$("#dlg");$("#dTitle").textContent=l.name+" – "+o;$("#note").value="";const w=o==="Call back"||o==="Interested";$("#dWhen").style.display=w?"block":"none";$("#dt").value="";$("#dt").required=o==="Call back";
 d.onclose=()=>res(d.returnValue==="ok"?{note:$("#note").value.trim(),when:$("#dt").value}:null);d.showModal()})}
document.querySelectorAll(".qp button").forEach(b=>b.onclick=()=>{const n=+b.dataset.q;const d=new Date(Date.now()+n*864e5);let day=dk(d),hh=n===0?"16:00":"09:00";const wd=new Date(day+"T12:00:00+02:00").getUTCDay();
 if(wd===0){day=dk(new Date(Date.parse(day+"T12:00:00+02:00")+864e5));}else if(wd===6&&n)hh="10:00";$("#dt").value=day+"T"+hh});
$("#list").addEventListener("click",async e=>{const b=e.target.closest("button[data-o]");if(!b)return;const id=+b.closest(".card").dataset.id,l=leads.find(x=>x.id===id),o=b.dataset.o;
 const r=await ask(l,o);if(!r)return;if(o==="Call back"&&!r.when)return alert("Pick a date & time");
 const body={lead_id:id,outcome:o,note:r.note||null,callback_at:r.when?r.when+":00+02:00":null};
 b.disabled=true;try{const d=await api("POST",body);Object.assign(l,d.lead);undoId=d.event_id;toast(o+" saved ✓");render()}catch(err){alert("Not saved: "+err.message);b.disabled=false}});
function toast(t){$("#tmsg").textContent=t;$("#toast").style.display="flex";clearTimeout(toast.t);toast.t=setTimeout(()=>$("#toast").style.display="none",7000)}
$("#undo").onclick=async()=>{if(!undoId)return;try{await api("POST",{action:"undo",event_id:undoId});undoId=null;$("#toast").style.display="none";load()}catch(e){alert("Undo failed: "+e.message)}};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});load();
</script></body></html>
